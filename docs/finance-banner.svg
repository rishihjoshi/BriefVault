<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Market Pulse — finance">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d30"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="farea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f9d6b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1f9d6b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title{font-family:Georgia,'Times New Roman',serif;fill:#f5f2ec;font-weight:700}
      .eyebrow{font-family:Arial,Helvetica,sans-serif;fill:#e4b23c;font-weight:700;letter-spacing:3px}
    </style>
  </defs>
  <rect width="640" height="360" fill="url(#fbg)"/>
  <g stroke="#20314a" stroke-width="1">
    <line x1="40" y1="300" x2="604" y2="300"/>
    <line x1="40" y1="250" x2="604" y2="250"/>
    <line x1="40" y1="200" x2="604" y2="200"/>
    <line x1="40" y1="150" x2="604" y2="150"/>
  </g>
  <path fill="url(#farea)" d="M40 282 L118 254 L196 268 L274 214 L352 230 L430 176 L508 158 L586 120 L586 320 L40 320 Z"/>
  <path fill="none" stroke="#35d492" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="760" stroke-dashoffset="0" d="M40 282 L118 254 L196 268 L274 214 L352 230 L430 176 L508 158 L586 120">
    <animate attributeName="stroke-dashoffset" from="760" to="0" dur="2.2s" begin="0s" fill="freeze"/>
  </path>
  <circle cx="586" cy="120" fill="#35d492" opacity="0">
    <animate attributeName="r" values="6;22" dur="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="586" cy="120" r="6" fill="#35d492">
    <animate attributeName="opacity" values="1;0.55;1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <text class="eyebrow" x="42" y="54" font-size="15">MARKETS &amp; MONEY</text>
  <text class="title" x="40" y="104" font-size="54">Market Pulse</text>
</svg>
