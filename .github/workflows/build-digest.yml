name: Build daily digest

on:
  schedule:
    # 11:00 and 23:00 UTC ≈ 6am / 6pm America/Chicago (CDT). Adjust ±1h over DST if you care.
    - cron: '0 11,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-digest.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/digest.json
          git diff --cached --quiet || git commit -m "chore: refresh digest $(date -u +%FT%TZ)"
          git push
